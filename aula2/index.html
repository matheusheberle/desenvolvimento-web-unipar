<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 2</title>
</head>
<body>
    <h1>Formulário de Cadastro</h1>

    <form action="/cadastrar" method="post">

    <fieldset>
        <legend>Informações Pessoais</legend>

    <label for="nome">Nome:</label><br>
    <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>

    <p>
        <label for="email">Email</label><br>
        <input type="email" id="email" name="email" placeholder="Digite seu email" required>
    </p>

    <p>
        <label for="senha">Senha</label><br>
        <input type="password" id="senha" name="senha" placeholder="Digite sua senha" minlength="6" required>
    </p>

    <p>    
        <input type="radio" name="genero" value="masculino" id="masculino">
        <label for="masculino">Masculino</label>
    
        <input type="radio" name="genero" value="feminino" id="feminino">
        <label for="feminino">Feminino</label>
    </p>

    <p>
        <label for="biografia">Biografia</label><br>
        <textarea id="biografia" name="biografia" placeholder="Sua biografia"></textarea>
    </p>

    <p>
        <input type="checkbox" id="termos" name="termos" required>
        <label for="termos">Aceito os termos e condições</label>
    </p>

    <button type="submit">Cadastrar</button>
    </fieldset>
    </form>
</body>
</html>
